    <style>
      :root {
        color: #0f172a;
        background: #f7f7f4;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #f7f7f4;
        color: #0f172a;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 40;
        border-bottom: 1px solid rgb(15 23 42 / 10%);
        background: rgb(247 247 244 / 95%);
        backdrop-filter: blur(8px);
      }
      .wrap {
        max-width: 1152px;
        margin: 0 auto;
        padding-left: 32px;
        padding-right: 32px;
      }
      .header-content {
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .brand {
        color: #0f172a;
        font-family: "Merriweather", Georgia, serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.015em;
        text-decoration: none;
      }
      .header-links {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 14px;
      }
      .link {
        color: #155e75;
        font-weight: 600;
        text-decoration: none;
      }
      .link:hover {
        color: #083344;
      }
      main {
        flex: 1;
        padding-top: 48px;
        padding-bottom: 64px;
      }
      .heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 28px;
      }
      .eyebrow {
        color: #155e75;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      h1 {
        margin: 12px 0 0;
        font-family: "Merriweather", Georgia, serif;
        font-size: 40px;
        line-height: 1.15;
      }
      .subtitle {
        margin: 12px 0 0;
        color: #475569;
        font-size: 15px;
        line-height: 1.6;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .btn-primary,
      .btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 18px;
        text-decoration: none;
        white-space: nowrap;
      }
      .btn-primary {
        background: #0f172a;
        color: #ffffff;
      }
      .btn-primary:hover {
        background: #334155;
      }
      .btn-secondary {
        border: 1px solid #cbd5e1;
        background: transparent;
        color: #0f172a;
      }
      .btn-secondary:hover {
        background: #ffffff;
      }
      .document {
        overflow: hidden;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        box-shadow: 4px 4px 0 0 rgb(8 145 178 / 16%);
      }
      iframe {
        width: 100%;
        height: 78vh;
        min-height: 680px;
        border: 0;
        display: block;
      }
      .fallback-note {
        margin-top: 16px;
        color: #475569;
        font-size: 14px;
      }
      footer {
        background: #0f172a;
        color: #94a3b8;
        font-size: 14px;
        padding: 24px 0;
      }
      .footer-content {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      footer a {
        color: #cbd5e1;
        text-decoration: none;
      }
      footer a:hover {
        color: #ffffff;
      }
      @media (max-width: 640px) {
        .wrap {
          padding-left: 20px;
          padding-right: 20px;
        }
        main {
          padding-top: 32px;
        }
        .heading {
          align-items: flex-start;
          flex-direction: column;
        }
        h1 {
          font-size: 32px;
        }
        iframe {
          min-height: 520px;
        }
      }
    </style>
  </head>
  <body>

              Download PDF ↓
            </a>
            <a
              class="btn-secondary"
              href="/cv/CV_2026_JinsuHong_penn_r1.pdf"

            >
              Open in new tab ↗
            </a>

        <div class="document">
          <iframe
            title="Jinsu Hong curriculum vitae"
            src="/cv/CV_2026_JinsuHong_penn_r1.pdf"

        </div>

        <p class="fallback-note">
          Viewing on mobile or having trouble loading the embedded PDF?
          <a class="link" href="/cv/CV_2026_JinsuHong_penn_r1.pdf" download>
            Download the PDF directly.
          </a>
        </p>
      </div>
    </main>

    <footer>
      <div class="wrap footer-content">
        <span>© 2026 Jinsu Hong</span>
        <a href="mailto:jhong36@gsu.edu">jhong36@gsu.edu</a>
      </div>
    </footer>

</html>
