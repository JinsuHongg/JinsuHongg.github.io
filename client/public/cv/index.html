<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV | Jinsu Hong</title>
    <style>
      :root { color: #0f172a; background: #f7f7f4; font-family: Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      header { border-bottom: 1px solid rgb(15 23 42 / 10%); }
      .header-content, main { max-width: 1152px; margin: 0 auto; padding-left: 32px; padding-right: 32px; }
      .header-content { min-height: 65px; display: flex; align-items: center; justify-content: space-between; }
      .name { color: inherit; font-family: Georgia, serif; font-size: 18px; font-weight: 700; text-decoration: none; }
      .back, .open { color: #155e75; font-size: 14px; font-weight: 600; text-decoration: none; }
      main { padding-top: 64px; padding-bottom: 64px; }
      .heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 32px; }
      .eyebrow { color: #155e75; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 12px 0 0; font-family: Georgia, serif; font-size: 48px; }
      p { color: #475569; line-height: 1.6; }
      .open { display: inline-block; border-radius: 6px; background: #0f172a; color: white; padding: 11px 18px; white-space: nowrap; }
      iframe { width: 100%; height: 75vh; min-height: 640px; border: 0; display: block; }
      .document { overflow: hidden; border: 1px solid rgb(15 23 42 / 10%); border-radius: 8px; background: white; box-shadow: 0 1px 2px rgb(15 23 42 / 8%); }
      @media (max-width: 640px) { .header-content, main { padding-left: 20px; padding-right: 20px; } main { padding-top: 40px; } .heading { align-items: start; flex-direction: column; } h1 { font-size: 38px; } }
    </style>
  </head>
  <body>
    <header>
      <div class="header-content">
        <a class="name" href="/">Jinsu Hong</a>
        <a class="back" href="/">← Back to home</a>
      </div>
    </header>
    <main>
      <div class="heading">
        <div>
          <div class="eyebrow">Curriculum vitae</div>
          <h1>Jinsu Hong</h1>
          <p>View the current CV below, open it in Google Docs, or download a copy.</p>
        </div>
        <a class="open" href="https://docs.google.com/document/d/1LrdX1Q2o6EtWFf3kHnJSldFXJRPbWZe8/edit?usp=sharing&amp;ouid=117414335558668737707&amp;rtpof=true&amp;sd=true" target="_blank" rel="noreferrer">Open in Google Docs ↗</a>
      </div>
      <div class="document">
        <iframe title="Jinsu Hong curriculum vitae" src="https://docs.google.com/document/d/1LrdX1Q2o6EtWFf3kHnJSldFXJRPbWZe8/preview"></iframe>
      </div>
      <p>Having trouble viewing the document? <a class="back" href="https://docs.google.com/document/d/1LrdX1Q2o6EtWFf3kHnJSldFXJRPbWZe8/edit?usp=sharing&amp;ouid=117414335558668737707&amp;rtpof=true&amp;sd=true" target="_blank" rel="noreferrer">Open or download the CV in Google Docs ↗</a></p>
    </main>
  </body>
</html>
